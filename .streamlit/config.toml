[client]
# Never show stack traces to visitors; errors are logged on the server.
showErrorDetails = "none"

[browser]
gatherUsageStats = false

# Both themes are defined, so viewers can switch under ⋮ → Settings.
[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#1a1a19"
secondaryBackgroundColor = "#262624"
textColor = "#f0efec"
